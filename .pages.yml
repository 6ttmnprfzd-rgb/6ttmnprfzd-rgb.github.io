
media:
  input: images
  output: images

content:
  - name: gallery
    label: Фотографии сайта
    type: file
    path: gallery-data.json
    format: json
    fields:
      - name: homepage
        label: Фотографии на главной
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Фото {index}"
        fields:
          - name: image
            label: Фотография
            type: image
          - name: alt
            label: Описание
            type: string

      - name: photos
        label: Общая фотогалерея
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Фото {index}"
        fields:
          - name: image
            label: Фотография
            type: image
          - name: alt
            label: Описание
            type: string

