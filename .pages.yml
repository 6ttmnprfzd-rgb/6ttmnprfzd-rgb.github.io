media:
  input: images
  output: images

content:
  - name: gallery
    label: Фотографии сайта
    type: file
    path: gallery-data.json
    format: json
    fields:
      - name: homepage
        label: Фотографии на главной
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Фото {index}"
        fields:
          - name: image
            label: Фотография
            type: image
          - name: alt
            label: Описание
            type: string

      - name: photos
        label: Общая фотогалерея
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Фото {index}"
        fields:
          - name: image
            label: Фотография
            type: image
          - name: alt
            label: Описание
            type: string

  - name: videos
    label: Видео сайта
    type: file
    path: videos-data.json
    format: json
    fields:
      - name: videos
        label: Видеоролики
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Видео {index}"
        fields:
          - name: video
            label: Видеофайл MP4
            type: file
          - name: cover
            label: Обложка видео
            type: image
          - name: title
            label: Название
            type: string
