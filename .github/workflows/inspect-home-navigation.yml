name: Inspect live homepage navigation styling
on:
  push:
    paths:
      - .github/workflows/inspect-home-navigation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect real brush logo source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['brand-brush','--brand','logo-mark','brush-logo','logoSvg','brushLogo']:
            matches=list(re.finditer(re.escape(term),s,re.I))
            print('TERM',term,'COUNT',len(matches))
            for m in matches[:10]:
              p=m.start()
              t=s[max(0,p-420):p+700]
              t=re.sub(r'data:image/[^)'"]{90,}', '[INLINE_IMG]',t)
              print('NEAR',p,t.replace('\n',' ')[:1000])
          PY
