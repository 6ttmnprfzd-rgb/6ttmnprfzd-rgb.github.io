name: Inspect live homepage navigation styling
on:
  push:
    paths:
      - .github/workflows/inspect-home-navigation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract final homepage CSS header rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          selectors=[r"header\.top",r"\.top",r"\.nav",r"\.brand-brush",r"\.logo",r"\.brand-sub",r"\.links",r"\.btn",r"\.mobile-menu",r"\.container"]
          for token in selectors:
            results=[]
            for m in re.finditer(r'([^{}]+)\{([^{}]*)\}',s):
              sel=m.group(1).strip().splitlines()[-1].strip()
              if re.search(token,sel) and len(sel)<220 and len(m.group(2))<650:
                results.append((sel,m.group(2).strip(),m.start()))
            print('CSS',token,'COUNT',len(results))
            for rule,body,position in results[-12:]:
              print('RULE',position,rule,'{',body,'}')
          PY
