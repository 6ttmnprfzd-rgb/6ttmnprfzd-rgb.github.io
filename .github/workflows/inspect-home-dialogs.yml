name: Inspect homepage dialogs and links
on:
  push:
    paths:
      - .github/workflows/inspect-home-dialogs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect modal triggers and templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text('utf8')
          for name in ['wc-contact-overlay','price-overlay','gallery-full','gallery-overlay','gallery-modal','gallery-video-player','gallery-video-overlay','photo-lightbox','gallery-fullscreen']:
            m=re.search(r'id="'+re.escape(name)+'"',s)
            if m:print('OVERLAY_SNIP',name,re.sub(r'\\s+',' ',s[max(0,m.start()-200):m.start()+2900])[:3100])
          print('CONTACT EMAILS',list(dict.fromkeys(re.findall(r'[\\w.+-]+@[\\w.-]+',s)))[:30])
          print('DIALOG TAGS')
          for m in re.finditer(r'<dialog\b[^>]*>',s): print(m.group()[:400])
          print('POSSIBLE MODAL IDS')
          for m in re.finditer(r'\bid="([^"]*(?:dialog|modal|gallery|price|contact|genre)[^"]*)"',s,re.I):
            print(m.group(1),':',re.sub(r'\s+',' ',s[max(0,m.start()-130):m.end()+130])[:310])
          print('TRIGGER CONTEXT')
          needles=['contactsDialog','priceDialog','galleryDialog','showModal','openGallery','openPrice','openContacts','#contacts-dialog','#price-dialog','#gallery-dialog','open-request','genre-all-toggle','all-genres-dialog','openContactsModal','openContact','getElementById("contacts"','getElementById("price"','getElementById("gallery"']
          for word in needles:
            matches=list(re.finditer(re.escape(word),s,re.I))
            print('TERM',word,'COUNT',len(matches))
            for m in matches[-3:]:
              print('CONTEXT',re.sub(r'\s+',' ',s[max(0,m.start()-430):m.end()+600])[:1100])
          PY
