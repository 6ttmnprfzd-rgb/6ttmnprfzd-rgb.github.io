name: Inspect homepage genre UI for exact reuse
on:
  push:
    paths:
      - .github/workflows/inspect-home-genres.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print genre section and relevant CSS and JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text('utf8')
          print('TOTAL_SIZE',len(s))
          terms=['id="genres"','genres-featured','id="all-genres-dialog"','all-genres-dialog','genre-carousel','genre-rail','genre-next','genre-prev','genres-all','data-genre','openAllGenres','renderGenres','genre-media','genre-grid']
          for t in terms:
            found=list(re.finditer(re.escape(t),s,re.I))
            print('TERM',t,'COUNT',len(found))
            for v in found[:3]:
              a=max(0,v.start()-250);b=min(len(s),v.start()+1450)
              print('CONTEXT',t,v.start(),s[a:b].replace('\n',' ')[:1700])
          for token in ['.genres-featured','.genre h3','.genre-card','.genre-carousel','#all-genres-dialog','.genre{','.genre img','genre-track']:
            found=list(re.finditer(re.escape(token),s))
            print('STYLES',token,len(found))
            for v in found[:5]:print('STYLE_SNIP',token,repr(s[max(0,v.start()-110):v.start()+1100]))
          PY
